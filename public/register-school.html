<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register a school · Liffan</title>
<style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f2f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}main{width:min(100%,560px);background:#fff;border:1px solid #dce5f0;border-radius:18px;padding:30px;box-shadow:0 16px 40px #192d4a12}.brand{font-size:12px;font-weight:850;letter-spacing:.14em;color:#245ad6}h1{margin:10px 0 6px;font-size:26px}p{color:#526078;line-height:1.5}label{display:block;margin:15px 0 6px;font-size:14px;font-weight:700}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{width:100%;padding:13px;margin-top:18px;background:#245ad6;color:#fff;border:0;border-radius:10px;font:inherit;font-weight:750;cursor:pointer}.msg{margin-top:14px;white-space:pre-wrap}a{color:#245ad6}.links{margin-top:18px}</style></head><body><main><div class="brand">LIFFAN · ALL-SCHOOL</div><h1>Register your school</h1><p>Submit your school's details for review. The platform administrator will approve access, set the paid-through date, and create your first school-admin account.</p><form id="form"><label for="name">School name</label><input id="name" required minlength="3" maxlength="160"><label for="contact_email">Official contact email</label><input id="contact_email" type="email" required><label for="phone">Phone number</label><input id="phone" autocomplete="tel"><label for="county">County / location</label><input id="county"><button id="submit">Submit school application</button></form><div id="message" class="msg" role="status" aria-live="polite"></div><div class="links"><a href="/school-login.html">Already have an account? Sign in</a> · <a href="/">Home</a></div></main>
<script>const form=document.querySelector('#form'),button=document.querySelector('#submit'),message=document.querySelector('#message');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.textContent='Submitting application…';try{const body={name:document.querySelector('#name').value.trim(),contact_email:document.querySelector('#contact_email').value.trim(),phone:document.querySelector('#phone').value.trim(),county:document.querySelector('#county').value.trim()};const r=await fetch('/api/schools',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`Submission failed (${r.status}).`);form.reset();message.textContent=`Application submitted. Reference: ${d.school?.id||d.school_id||'received'}. Access remains pending until the platform administrator approves it.`;}catch(err){message.textContent=err.message||'Could not submit application.';}finally{button.disabled=false;}});</script></body></html>
