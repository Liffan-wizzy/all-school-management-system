<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My workspace · Liffan</title>
<style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f2f6fb}*{box-sizing:border-box}body{margin:0;padding:22px}.wrap{width:min(100%,980px);margin:auto}.top,.card{background:#fff;border:1px solid #dce5f0;border-radius:16px;padding:22px}.top{display:flex;gap:18px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:16px}.brand{font-size:12px;font-weight:850;letter-spacing:.12em;color:#245ad6}h1{font-size:27px;margin:8px 0}p{color:#526078;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card h2{font-size:18px;margin:4px 0 8px}.card a,.btn{display:inline-block;margin-top:8px;padding:10px 13px;background:#245ad6;color:#fff;text-decoration:none;border:0;border-radius:9px;font-weight:700;cursor:pointer}.minor{background:#edf2ff;color:#234eab}.pill{display:inline-block;padding:5px 8px;background:#e8f1ff;color:#214bb5;border-radius:999px;font-size:12px;font-weight:800}button{font:inherit}.status{margin:12px 0}.logout{padding:9px 12px;border:1px solid #d3dce9;background:#fff;border-radius:9px;cursor:pointer}.foot{font-size:13px;color:#64748b;margin-top:18px}</style></head>
<body><div class="wrap"><header class="top"><div><div class="brand">LIFFAN · ALL-SCHOOL</div><h1 id="welcome">Loading your workspace…</h1><p id="identity">Checking signed-in account</p></div><button class="logout" id="logout">Sign out</button></header><div id="cards" class="grid"></div><p class="foot">Your role controls the areas you can access. Features without a connected, school-scoped API are not enabled for real school records yet.</p></div>
<script>
const cards=document.querySelector('#cards');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const definitions={
 PLATFORM_ADMIN:[['School applications & paid access','Approve schools, set plan expiry, and create the first school administrator.','/platform-schools.html'],['Account requests','View registration requests across schools.','/role-review.html']],
 SCHOOL_ADMIN:[['School operations workspace','Manage assigned subjects, marks, attendance, fees, notices and staff invitations.','/school-workspace.html'],['Registration approvals','Approve or reject teachers, secretaries and parent requests for your school.','/role-review.html'],['Student records','View students and add records according to your permissions.','/students.html'],['School dashboard','Open the existing school dashboard.','/']],
 SECRETARY:[['School operations workspace','Manage permitted attendance, fees, notices and view academics.','/school-workspace.html'],['Student records','Add and view records for your school.','/students.html'],['School dashboard','Open the existing school dashboard.','/']],
 TEACHER:[['School operations workspace','Enter marks and attendance for your assigned classes.','/school-workspace.html'],['Student list','View student records for your school.','/students.html']],
 PARENT:[['Parent dashboard','View linked-child marks, attendance, fee records and school notices.','/school-workspace.html'],['My linked children','View only students that the school has verified and linked to your account.','/parent-children.html']]
};
function render(user){document.querySelector('#welcome').textContent=`Welcome, ${user.full_name}`;document.querySelector('#identity').textContent=`${user.email} · ${user.role}${user.school_id?` · School ${user.school_id}`:''}`;const list=definitions[user.role]||[];cards.innerHTML=list.map(([title,desc,href,active=true])=>`<section class="card"><span class="pill">${active?'AVAILABLE':'NOT CONNECTED'}</span><h2>${esc(title)}</h2><p>${esc(desc)}</p><a class="${active?'':'minor'}" href="${esc(href)}">${active?'Open':'View dashboard'}</a></section>`).join('');}
(async()=>{try{const r=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.user){location.href='/school-login.html';return;}render(d.user);}catch{location.href='/school-login.html';}})();
document.querySelector('#logout').addEventListener('click',async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});location.href='/school-login.html';});
</script></body></html>
