<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Opening Workspace · Liffan</title>

<style>

:root{
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  background:#f2f6fb;
  color:#172033;
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

main{
  width:min(100%,420px);
  background:white;
  border:1px solid #dce5f0;
  border-radius:18px;
  padding:30px;
  text-align:center;
}

.brand{
  color:#245ad6;
  font-size:12px;
  font-weight:900;
  letter-spacing:.13em;
}

h1{
  margin:12px 0;
}

p{
  color:#526078;
  line-height:1.5;
}

a{
  color:#245ad6;
}

</style>

</head>

<body>

<main>

<div class="brand">
LIFFAN · EDUCATION
</div>

<h1>Opening your workspace…</h1>

<p id="message">
Checking your account and school access.
</p>

</main>


<script>

const message =
  document.querySelector('#message');


function destinationFor(user){

switch(user.role){

case 'PLATFORM_ADMIN':

return '/platform-schools.html';


case 'SCHOOL_ADMIN':

return '/school-workspace.html';


case 'SECRETARY':

case 'FINANCE_OFFICE':

case 'TEACHER':

case 'PARENT':

return '/school-workspace.html';


default:

return null;

}

}


(async()=>{

try{

const response =
  await fetch(
    '/api/auth/me',
    {
      credentials:'same-origin',
      cache:'no-store'
    }
  );


const data =
  await response.json()
  .catch(()=>({}));


if(
  !response.ok ||
  !data.user
){

location.replace(
  '/school-login.html'
);

return;

}


const destination =
  destinationFor(data.user);


if(!destination){

message.innerHTML =
  'No workspace is assigned to this account. ' +
  '<a href="/">Return home</a>.';

return;

}


location.replace(
  destination
);

}

catch(error){

location.replace(
  '/school-login.html'
);

}

})();

</script>

</body>
</html>
