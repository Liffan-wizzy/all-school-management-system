<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accept invitation | Liffan</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f2f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}main{width:min(100%,470px);background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:26px;box-shadow:0 18px 42px #1b2a4a12}.brand{font-size:11px;font-weight:850;letter-spacing:.12em;color:#245ad6}h1{margin:10px 0 6px}p{color:#59677e;line-height:1.5}label{display:grid;gap:6px;margin-top:14px;font-weight:700;font-size:13px}input{width:100%;padding:12px;border:1px solid #ccd5e3;border-radius:9px;font:inherit}button{width:100%;margin-top:18px;border:0;border-radius:9px;background:#245ad6;color:white;padding:13px;font:inherit;font-weight:800;cursor:pointer}.msg{white-space:pre-wrap;margin-top:12px;color:#536079;font-size:14px}a{color:#245ad6}</style></head><body><main><div class="brand">LIFFAN · ALL-SCHOOL</div><h1>Accept school invitation</h1><p>Use the one-time invitation code shared by your school administrator. Codes expire after 72 hours.</p><form id="form"><label>Invitation code<input name="invite_code" autocomplete="one-time-code" required></label><label>Full name<input name="full_name" autocomplete="name" minlength="2" maxlength="120" required></label><label>Create password (12+ characters)<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label><button id="submit">Accept invitation</button></form><div id="message" class="msg" role="status" aria-live="polite"></div><p><a href="/school-login.html">Back to sign in</a></p><script>
const form=document.querySelector('#form'),msg=document.querySelector('#message'),button=document.querySelector('#submit');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;msg.textContent='Checking invitation…';const payload=Object.fromEntries(new FormData(form).entries());try{const r=await fetch('/api/auth/accept-invite',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);msg.textContent='Invitation accepted. Redirecting you to sign in…';setTimeout(()=>location.href='/school-login.html',1200);}catch(err){msg.textContent=err.message;button.disabled=false;}});
</script></main></body></html>
