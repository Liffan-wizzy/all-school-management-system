<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration requests · Liffan</title>
<style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f2f6fb}*{box-sizing:border-box}body{margin:0;padding:22px}.wrap{max-width:1000px;margin:auto}.box{background:#fff;border:1px solid #dce5f0;border-radius:16px;padding:22px;margin-bottom:14px}.brand{font-size:12px;font-weight:850;letter-spacing:.12em;color:#245ad6}h1{margin:8px 0 6px}p{color:#526078;line-height:1.5}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}select,button{font:inherit;padding:10px 12px;border-radius:9px;border:1px solid #cbd5e1;background:#fff}button{cursor:pointer;font-weight:700}.primary{background:#245ad6;color:#fff;border-color:#245ad6}.danger{color:#9f1239;border-color:#fecdd3}.item{border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.tag{font-size:12px;font-weight:800;border-radius:99px;background:#e8f1ff;color:#214bb5;padding:5px 8px}.actions{display:flex;gap:8px;margin-top:12px}.msg{white-space:pre-wrap;color:#475569}.meta{font-size:13px;color:#64748b}a{color:#245ad6}</style></head><body><div class="wrap">
<section class="box"><div class="brand">LIFFAN · ALL-SCHOOL</div><h1>Account registration requests</h1><p>Only platform admins and the matching school administrator can review these requests. Parent requests are approved only when the child’s admission number matches a student in the same school.</p><div class="toolbar"><label for="status">Show</label><select id="status"><option value="PENDING">Pending</option><option value="APPROVED">Approved</option><option value="REJECTED">Rejected</option><option value="ALL">All requests</option></select><button id="reload" class="primary">Refresh</button><a href="/role-dashboard.html">Back to workspace</a></div><div id="message" class="msg" role="status"></div></section>
<section class="box"><div id="list">Loading requests…</div></section></div>
<script>
const list=document.querySelector('#list'),message=document.querySelector('#message'),statusSelect=document.querySelector('#status');let currentRole='';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){list.textContent='Loading requests…';message.textContent='';try{const me=await fetch('/api/auth/me',{cache:'no-store'});const md=await me.json();if(!me.ok||!md.user){location.href='/school-login.html';return;}currentRole=md.user.role;if(!['PLATFORM_ADMIN','SCHOOL_ADMIN'].includes(currentRole)){list.textContent='You are not allowed to review registration requests.';return;}const r=await fetch('/api/auth/requests?status='+encodeURIComponent(statusSelect.value),{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load requests.');if(!d.requests?.length){list.textContent='No requests in this category.';return;}list.innerHTML=d.requests.map(item=>`<article class="item"><div class="row"><strong>${esc(item.full_name)}</strong><span class="tag">${esc(item.role)}</span></div><p>${esc(item.email)}<br><span class="meta">School ID: ${esc(item.school_id)} · Submitted: ${esc(item.created_at||'')}</span></p>${item.role==='PARENT'?`<p>Child admission number: <strong>${esc(item.student_ref)}</strong></p>`:''}<p>Status: ${esc(item.status)}</p>${item.status==='PENDING'?`<div class="actions"><button class="primary" data-action="APPROVE" data-id="${esc(item.id)}">Approve</button><button class="danger" data-action="REJECT" data-id="${esc(item.id)}">Reject</button></div>`:''}</article>`).join('');}catch(e){list.textContent=e.message||'Could not load requests.';}}
list.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const action=b.dataset.action;if(action==='REJECT'&&!confirm('Reject this registration request?'))return;if(action==='APPROVE'&&!confirm('Approve and create this user account?'))return;b.disabled=true;message.textContent=`${action==='APPROVE'?'Approving':'Rejecting'} request…`;try{const r=await fetch('/api/auth/requests',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:b.dataset.id,decision:action})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Review failed.');message.textContent=d.message||'Request reviewed.';await load();}catch(err){message.textContent=err.message||'Review failed.';b.disabled=false;}});
document.querySelector('#reload').addEventListener('click',load);statusSelect.addEventListener('change',load);load();
</script></body></html>
