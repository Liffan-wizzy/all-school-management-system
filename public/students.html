<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student records · Liffan</title>
<style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f2f6fb}*{box-sizing:border-box}body{margin:0;padding:22px}.wrap{max-width:1050px;margin:auto}.box{background:#fff;border:1px solid #dce5f0;border-radius:16px;padding:22px;margin-bottom:14px}.brand{font-size:12px;font-weight:850;letter-spacing:.12em;color:#245ad6}h1{margin:8px 0 6px}p{color:#526078;line-height:1.5}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input,select,button{width:100%;font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:9px}button{background:#245ad6;border-color:#245ad6;color:#fff;font-weight:750;cursor:pointer}.msg{margin:12px 0;white-space:pre-wrap}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;border-bottom:1px solid #e2e8f0;padding:11px;font-size:14px}th{background:#f8fafc}.links{margin:12px 0}a{color:#245ad6}</style></head><body><div class="wrap"><section class="box"><div class="brand">LIFFAN · ALL-SCHOOL</div><h1>Student records</h1><p>Records below are limited to your signed-in school. Teachers can view; school administrators and secretaries can add students.</p><div class="links"><a href="/role-dashboard.html">← Back to workspace</a></div></section>
<section class="box" id="addBox" hidden><h2>Add student</h2><form id="addForm"><div><label for="full_name">Student full name</label><input id="full_name" required></div><div><label for="admission_no">Admission number</label><input id="admission_no"></div><div><label for="class_name">Class / form</label><input id="class_name"></div><div><label for="stream">Stream</label><input id="stream"></div><div><label for="gender">Gender</label><select id="gender"><option value="">Choose</option><option>Female</option><option>Male</option><option>Other</option></select></div><div><button id="addButton" type="submit">Save student</button></div></form></section>
<section class="box"><div id="message" class="msg" role="status"></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Admission No.</th><th>Class</th><th>Stream</th><th>Gender</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></div>
<script>
const rows=document.querySelector('#rows'),message=document.querySelector('#message');let role='';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){try{const me=await fetch('/api/auth/me',{cache:'no-store'});const md=await me.json();if(!me.ok||!md.user){location.href='/school-login.html';return;}role=md.user.role;if(!['SCHOOL_ADMIN','SECRETARY','TEACHER'].includes(role)){rows.innerHTML='<tr><td colspan="5">This role cannot view the student list.</td></tr>';return;}document.querySelector('#addBox').hidden=!['SCHOOL_ADMIN','SECRETARY'].includes(role);const r=await fetch('/api/students',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load students.');rows.innerHTML=(d.students||[]).map(s=>`<tr><td>${esc(s.full_name??s.name??s.student_name)}</td><td>${esc(s.admission_no??s.admission_number)}</td><td>${esc(s.class_name??s.class??s.grade??s.form)}</td><td>${esc(s.stream)}</td><td>${esc(s.gender)}</td></tr>`).join('')||'<tr><td colspan="5">No student records yet.</td></tr>';}catch(e){rows.innerHTML=`<tr><td colspan="5">${esc(e.message||'Could not load students.')}</td></tr>`;}}
document.querySelector('#addForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.querySelector('#addButton');b.disabled=true;message.textContent='Saving student…';try{const body={full_name:document.querySelector('#full_name').value.trim(),admission_no:document.querySelector('#admission_no').value.trim(),class_name:document.querySelector('#class_name').value.trim(),stream:document.querySelector('#stream').value.trim(),gender:document.querySelector('#gender').value};const r=await fetch('/api/students',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not save student.');e.target.reset();message.textContent=d.message||'Student saved.';await load();}catch(err){message.textContent=err.message||'Could not save student.';}finally{b.disabled=false;}});load();
</script></body></html>
