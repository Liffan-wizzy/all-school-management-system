<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Liffan All-School</title>
<style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f2f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}main{width:min(100%,440px);background:#fff;border:1px solid #dce5f0;border-radius:18px;padding:30px;box-shadow:0 16px 40px #192d4a12}.brand{font-size:12px;font-weight:850;letter-spacing:.14em;color:#245ad6}h1{font-size:26px;margin:10px 0 6px}p{color:#526078;line-height:1.5}label{display:block;margin:16px 0 6px;font-size:14px;font-weight:700}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{width:100%;padding:13px;margin-top:20px;background:#245ad6;color:#fff;border:0;border-radius:10px;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:14px;font-size:14px;white-space:pre-wrap}.links{font-size:14px;margin-top:18px;line-height:1.8}a{color:#245ad6}</style>
</head><body><main><div class="brand">LIFFAN · ALL-SCHOOL</div><h1>Sign in</h1><p>Sign in with the account approved for your school and role.</p>
<form id="loginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Sign in</button></form>
<div id="message" class="msg" role="status" aria-live="polite"></div><div class="links"><a href="/role-register.html">New teacher, secretary or parent? Request an account</a><br><a href="/accept-invite.html">Have a school invitation code?</a><br><a href="/register-school.html">Register a new school</a><br><a href="/">Return to website</a></div></main>
<script>const form=document.querySelector('#loginForm'),message=document.querySelector('#message'),button=document.querySelector('#submit');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.textContent='Signing in…';try{const r=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`Sign in failed (${r.status}).`);location.href='/role-dashboard.html';}catch(err){message.textContent=err.message||'Sign in failed.';button.disabled=false;}});</script></body></html>
