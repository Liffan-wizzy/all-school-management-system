<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Dashboard · Liffan</title>

<style>
:root{
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  color:#172033;
  background:#f2f6fb
}
*{box-sizing:border-box}
body{margin:0}

header{
  background:#132653;
  color:#fff;
  padding:18px clamp(16px,4vw,42px);
  display:flex;
  gap:16px;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap
}

.school-head{
  display:flex;
  gap:14px;
  align-items:center
}

.logo{
  width:66px;
  height:66px;
  border-radius:14px;
  background:#fff;
  object-fit:contain;
  padding:4px;
  display:none
}

.logo-placeholder{
  width:66px;
  height:66px;
  border-radius:14px;
  background:#245ad6;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:24px
}

.brand{
  font-weight:850;
  font-size:11px;
  letter-spacing:.12em;
  color:#a9c1ff
}

h1{margin:4px 0;font-size:24px}
header p{margin:0;color:#d5def7;font-size:13px}

button,a.btn{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  background:#245ad6;
  color:#fff;
  text-decoration:none;
  font:inherit;
  font-weight:700;
  cursor:pointer
}

.mutebtn{
  background:#e8eefc;
  color:#234eab
}

.danger{
  background:#b42318
}

.layout{
  max-width:1350px;
  margin:auto;
  padding:18px;
  display:grid;
  grid-template-columns:230px 1fr;
  gap:16px
}

@media(max-width:750px){
  .layout{
    grid-template-columns:1fr;
    padding:10px
  }
}

nav,.panel{
  background:white;
  border:1px solid #dce5f0;
  border-radius:14px;
  padding:14px;
  min-width:0
}

nav{
  display:grid;
  gap:6px;
  height:max-content
}

nav button{
  text-align:left;
  background:transparent;
  color:#33415c
}

nav button.active{
  background:#e8efff;
  color:#1745a8
}

.panel h2{margin:0 0 8px}

.muted{
  color:#5b6880;
  line-height:1.5
}

.msg{
  padding:10px;
  margin:12px 0;
  background:#eef3fc;
  border-radius:8px;
  white-space:pre-wrap
}

.err{
  color:#9e1c1c;
  background:#fff0f0
}

form{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  padding:14px;
  margin:14px 0;
  background:#f7f9fd;
  border:1px solid #e1e8f3;
  border-radius:11px
}

label{
  display:grid;
  gap:5px;
  font-size:13px;
  font-weight:700
}

input,select,textarea{
  width:100%;
  padding:10px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font:inherit
}

textarea{
  min-height:90px;
  grid-column:1/-1
}

pre{
  white-space:pre-wrap;
  overflow:auto;
  background:#0f1b33;
  color:#d5e5ff;
  padding:14px;
  border-radius:10px;
  font-size:12px;
  max-height:560px
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.profile{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px
}

.profile-card{
  border:1px solid #e1e8f3;
  border-radius:12px;
  padding:14px;
  background:#f8faff
}

.profile-card strong{
  display:block;
  margin-bottom:5px
}

.photos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:12px;
  margin-top:15px
}

.photo-card{
  border:1px solid #dce5f0;
  border-radius:12px;
  overflow:hidden;
  background:white
}

.photo-card img{
  width:100%;
  height:145px;
  object-fit:cover;
  display:block
}

.photo-info{
  padding:10px
}

.photo-info p{
  margin:0 0 8px;
  font-size:13px
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#e8efff;
  color:#1745a8;
  font-size:11px;
  font-weight:800
}
</style>
</head>

<body>

<header>

<div class="school-head">

<img id="schoolLogo" class="logo" alt="School logo">

<div id="logoPlaceholder" class="logo-placeholder">
S
</div>

<div>
<div class="brand">LIFFAN · SCHOOL</div>

<h1 id="title">School Dashboard</h1>

<p id="identity">
Checking your account…
</p>
</div>

</div>

<div class="actions">
<a class="btn mutebtn" href="/">Liffan Home</a>
<button id="logout" class="mutebtn">Sign out</button>
</div>

</header>


<div class="layout">

<nav id="nav"></nav>

<main class="panel">

<h2 id="moduleTitle">
Loading…
</h2>

<p id="description" class="muted"></p>

<div id="message" class="msg" hidden></div>

<div id="formSlot"></div>

<div id="contentSlot"></div>

<div id="standardActions" class="actions">
<button id="refresh" class="mutebtn">
Refresh records
</button>
</div>

<pre id="output">
Loading account…
</pre>

</main>

</div>


<script>

const $ = s =>
  document.querySelector(s);

let me = null;
let schoolProfile = null;
let current = 'home';

const esc = s =>
  String(s ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );


const modules = {

home:{
  title:'Overview',
  path:null,
  roles:[
    'SCHOOL_ADMIN',
    'SECRETARY',
    'FINANCE_OFFICE',
    'TEACHER',
    'PARENT'
  ],
  description:
    'Your school dashboard and permitted services.'
},

profile:{
  title:'School Profile & Media',
  path:'/api/school-profile',
  roles:[
    'SCHOOL_ADMIN',
    'SECRETARY',
    'FINANCE_OFFICE',
    'TEACHER',
    'PARENT'
  ],
  description:
    'School identity, contact information, logo and photos.',
  special:'profile'
},

students:{
  title:'Students',
  path:'/api/students',
  roles:[
    'SCHOOL_ADMIN',
    'SECRETARY',
    'TEACHER'
  ],
  description:
    'Student records belonging to this school.'
},

children:{
  title:'My Children',
  path:'/api/parent/children',
  roles:['PARENT'],
  description:
    'Children verified and linked to your parent account.'
},

subjects:{
  title:'Subjects',
  path:'/api/subjects',
  roles:[
    'SCHOOL_ADMIN',
    'SECRETARY',
    'TEACHER'
  ],
  description:
    'Subjects and class mappings.',
  form:'subject'
},

assignments:{
  title:'Teacher Assignments',
  path:'/api/teacher-assignments',
  roles:['SCHOOL_ADMIN','TEACHER'],
  description:
    'Teacher subject and class assignments.',
  form:'assignment'
},

marks:{
  title:'Marks & Academics',
  path:'/api/marks',
  roles:[
    'SCHOOL_ADMIN',
    'SECRETARY',
    'TEACHER',
    'PARENT'
  ],
  description:
    'Academic results according to your account permissions.',
  form:'mark'
},

attendance:{
  title:'Attendance',
  path:'/api/attendance',
  roles:[
    'SCHOOL_ADMIN',
    'SECRETARY',
    'TEACHER',
    'PARENT'
  ],
  description:
    'School attendance records according to your permissions.',
  form:'attendance'
},

fees:{
  title:'Fees & Payments',
  path:'/api/fees',
  roles:[
    'SCHOOL_ADMIN',
    'FINANCE_OFFICE',
    'PARENT'
  ],
  description:
    'School fees, payments, balances and financial records.',
  form:'fee'
},

announcements:{
  title:'Announcements',
  path:'/api/announcements',
  roles:[
    'SCHOOL_ADMIN',
    'SECRETARY',
    'TEACHER',
    'PARENT'
  ],
  description:
    'School notices and communication.',
  form:'announcement'
},

reports:{
  title:'Reports',
  path:'/api/reports',
  roles:[
    'SCHOOL_ADMIN',
    'SECRETARY',
    'FINANCE_OFFICE',
    'PARENT'
  ],
  description:
    'Reports available to your account.'
},

approvals:{
  title:'User Approvals',
  path:null,
  roles:['SCHOOL_ADMIN'],
  description:
    'Approve Secretary, Finance Office, Teacher and Parent access.',
  special:'approvals'
},

accounts:{
  title:'School Accounts',
  path:'/api/users',
  roles:['SCHOOL_ADMIN'],
  description:
    'Manage accounts belonging to this school.',
  form:'reset'
}

};


function canEditProfile(){
  return [
    'SCHOOL_ADMIN',
    'SECRETARY'
  ].includes(me.role);
}


const forms = {

subject:`
<label>
Subject name
<input name="name" required maxlength="100">
</label>

<label>
Subject code
<input name="code" maxlength="40">
</label>

<label>
Class / grade
<input name="class_name" required maxlength="80">
</label>
`,

assignment:`
<label>
Teacher account ID
<input name="teacher_user_id" required>
</label>

<label>
Subject ID
<input name="subject_id" required>
</label>

<label>
Class
<input name="class_name" required>
</label>

<label>
Can enter marks
<select name="can_mark">
<option value="1">Yes</option>
<option value="0">No</option>
</select>
</label>

<label>
Can record attendance
<select name="can_attend">
<option value="1">Yes</option>
<option value="0">No</option>
</select>
</label>
`,

mark:`
<label>
Student ID
<input name="student_id" required>
</label>

<label>
Subject ID
<input name="subject_id" required>
</label>

<label>
Assessment
<input name="assessment_name" required>
</label>

<label>
Term
<input name="term">
</label>

<label>
Score
<input name="score" type="number" min="0" step="0.01" required>
</label>

<label>
Maximum score
<input name="max_score" type="number" min="0.01" step="0.01" required>
</label>

<label>
Remarks
<input name="remarks">
</label>
`,

attendance:`
<label>
Student ID
<input name="student_id" required>
</label>

<label>
Date
<input
name="attendance_date"
type="date"
required
value="${new Date().toISOString().slice(0,10)}">
</label>

<label>
Status
<select name="status">
<option>PRESENT</option>
<option>ABSENT</option>
<option>LATE</option>
<option>EXCUSED</option>
</select>
</label>

<label>
Note
<input name="note">
</label>
`,

fee:`
<label>
Student ID
<input name="student_id" required>
</label>

<label>
Entry type
<select name="entry_type">
<option>CHARGE</option>
<option>PAYMENT</option>
<option>ADJUSTMENT</option>
</select>
</label>

<label>
Amount (KES)
<input name="amount" type="number" min="0.01" step="0.01" required>
</label>

<label>
Date
<input
name="transaction_date"
type="date"
value="${new Date().toISOString().slice(0,10)}"
required>
</label>

<label>
Description
<input name="description" required>
</label>

<label>
Reference
<input name="reference">
</label>
`,

announcement:`
<label>
Title
<input name="title" required maxlength="160">
</label>

<label>
Audience
<select name="audience">
<option>ALL</option>
<option>PARENTS</option>
<option>TEACHERS</option>
<option>STAFF</option>
</select>
</label>

<label style="grid-column:1/-1">
Message
<textarea name="body" required maxlength="5000"></textarea>
</label>
`,

reset:`
<label>
Target account ID
<input name="user_id" required>
</label>

<label>
New password (12+ characters)
<input
name="new_password"
type="password"
minlength="12"
required>
</label>
`

};


const postPaths = {
  subject:'/api/subjects',
  assignment:'/api/teacher-assignments',
  mark:'/api/marks',
  attendance:'/api/attendance',
  fee:'/api/fees',
  announcement:'/api/announcements',
  reset:'/api/auth/admin-reset-password'
};


async function api(path,options={}){

const response =
  await fetch(path,{
    credentials:'same-origin',
    cache:'no-store',
    ...options,

    headers:{
      ...(options.body
        ? {'Content-Type':'application/json'}
        : {}),
      ...(options.headers || {})
    }
  });


const data =
  await response.json()
  .catch(()=>({
    error:`Unexpected response (${response.status})`
  }));


if(!response.ok)
  throw new Error(
    data.error ||
    `Request failed (${response.status})`
  );

return data;

}


function say(text,error=false){

const message = $('#message');

message.hidden = !text;

message.classList.toggle(
  'err',
  error
);

message.textContent = text;

}


function modulesAvailable(){

return Object.keys(modules)
  .filter(
    key =>
      modules[key].roles.includes(me.role)
  );

}


function drawNav(){

const list =
  modulesAvailable();

$('#nav').innerHTML =
  list.map(
    key => `
      <button
        data-key="${key}"
        class="${current===key?'active':''}">
        ${esc(modules[key].title)}
      </button>
    `
  ).join('');


$('#nav')
  .querySelectorAll('button')
  .forEach(
    button =>
      button.addEventListener(
        'click',
        () => open(button.dataset.key)
      )
  );

}


function updateSchoolHeader(school){

if(!school) return;

schoolProfile = school;

$('#title').textContent =
  school.name || 'School Dashboard';

$('#identity').textContent =
  `${me.full_name} · ${me.role}`;


const logo =
  $('#schoolLogo');

const placeholder =
  $('#logoPlaceholder');


if(school.logo_url){

logo.src =
  school.logo_url;

logo.style.display =
  'block';

placeholder.style.display =
  'none';

}else{

logo.style.display =
  'none';

placeholder.style.display =
  'grid';

placeholder.textContent =
  String(
    school.name || 'S'
  )
  .trim()
  .charAt(0)
  .toUpperCase();

}

}


async function loadSchoolIdentity(){

try{

const data =
  await api('/api/school-profile');

updateSchoolHeader(
  data.school
);

}catch(error){

$('#title').textContent =
  'School Dashboard';

$('#identity').textContent =
  `${me.full_name} · ${me.role}`;

}

}


function renderProfile(data){

const school =
  data.school || {};

const photos =
  data.photos || [];

updateSchoolHeader(school);


let html = `

<div class="profile">

<div class="profile-card">
<strong>School</strong>
${esc(school.name || '—')}
</div>

<div class="profile-card">
<strong>Type</strong>
${esc(school.school_type || '—')}
</div>

<div class="profile-card">
<strong>Location</strong>
${esc(school.location || '—')}
</div>

<div class="profile-card">
<strong>Motto</strong>
${esc(school.motto || '—')}
</div>

<div class="profile-card">
<strong>Phone</strong>
${esc(school.phone || '—')}
</div>

<div class="profile-card">
<strong>Email</strong>
${esc(school.email || '—')}
</div>

</div>
`;


if(canEditProfile()){

html += `

<h3>Edit School Profile</h3>

<form id="profileForm">

<label>
School name
<input
name="name"
value="${esc(school.name || '')}"
required>
</label>

<label>
School type
<input
name="school_type"
value="${esc(school.school_type || '')}">
</label>

<label>
Location
<input
name="location"
value="${esc(school.location || '')}">
</label>

<label>
Motto
<input
name="motto"
value="${esc(school.motto || '')}">
</label>

<label>
Phone
<input
name="phone"
value="${esc(school.phone || '')}">
</label>

<label>
Email
<input
name="email"
type="email"
value="${esc(school.email || '')}">
</label>

<label>
Website
<input
name="website"
value="${esc(school.website || '')}"
placeholder="https://...">
</label>

<label>
Logo image URL
<input
name="logo_url"
value="${esc(school.logo_url || '')}"
placeholder="https://...">
</label>

<label style="grid-column:1/-1">
School description
<textarea name="description">${esc(school.description || '')}</textarea>
</label>

<button type="submit">
Save School Profile
</button>

</form>


<h3>Add School Photo</h3>

<form id="photoForm">

<label>
Photo URL
<input
name="photo_url"
required
placeholder="https://...">
</label>

<label>
Caption
<input
name="caption"
maxlength="200">
</label>

<button type="submit">
Add Photo
</button>

</form>
`;

}


html += `<h3>School Photos</h3>`;


if(!photos.length){

html += `
<p class="muted">
No school photos have been added yet.
</p>
`;

}else{

html += `<div class="photos">`;

html += photos.map(
  photo => `

<div class="photo-card">

<img
src="${esc(photo.photo_url)}"
alt="${esc(photo.caption || 'School photo')}">

<div class="photo-info">

<p>
${esc(photo.caption || 'School photo')}
</p>

${canEditProfile()
? `
<button
class="danger deletePhoto"
data-id="${esc(photo.id)}">
Remove
</button>
`
: ''}

</div>

</div>

`
).join('');

html += `</div>`;

}


$('#contentSlot').innerHTML =
  html;

$('#output').textContent =
  JSON.stringify(
    {
      school,
      photo_count:photos.length
    },
    null,
    2
  );


const profileForm =
  $('#profileForm');


if(profileForm){

profileForm.addEventListener(
'submit',
async event => {

event.preventDefault();

const body =
  Object.fromEntries(
    new FormData(profileForm).entries()
  );

body.action =
  'UPDATE_PROFILE';

try{

await api(
  '/api/school-profile',
  {
    method:'POST',
    body:JSON.stringify(body)
  }
);

say(
  'School profile updated successfully.'
);

await loadSchoolIdentity();
await load();

}catch(error){

say(
  error.message,
  true
);

}

}
);

}


const photoForm =
  $('#photoForm');


if(photoForm){

photoForm.addEventListener(
'submit',
async event => {

event.preventDefault();

const body =
  Object.fromEntries(
    new FormData(photoForm).entries()
  );

body.action =
  'ADD_PHOTO';

try{

await api(
  '/api/school-profile',
  {
    method:'POST',
    body:JSON.stringify(body)
  }
);

say(
  'School photo added successfully.'
);

photoForm.reset();

await load();

}catch(error){

say(
  error.message,
  true
);

}

}
);

}


document
.querySelectorAll('.deletePhoto')
.forEach(
button =>
  button.addEventListener(
  'click',
  async()=>{

  if(
    !confirm(
      'Remove this school photo?'
    )
  ) return;

  try{

  await api(
    '/api/school-profile',
    {
      method:'POST',

      body:JSON.stringify({
        action:'DELETE_PHOTO',
        photo_id:button.dataset.id
      })
    }
  );

  say(
    'School photo removed.'
  );

  await load();

  }catch(error){

  say(
    error.message,
    true
  );

  }

  }
  )
);

}


function renderApprovals(){

$('#contentSlot').innerHTML = `

<div class="profile-card">

<span class="badge">
SCHOOL ADMIN ONLY
</span>

<h3>
School User Management
</h3>

<p class="muted">
Approve Secretary, Finance Office,
Teacher and Parent accounts belonging
to this school.
</p>

<div class="actions">

<a
class="btn"
href="/role-review.html">
Review Account Requests
</a>

<a
class="btn mutebtn"
href="/role-register.html">
Register / Request School User
</a>

</div>

</div>
`;

$('#output').textContent =
  'School user approvals are restricted to the School Administrator.';

}


function shownData(data){

const copy = {
  ...data
};

delete copy.ok;

$('#output').textContent =
  JSON.stringify(
    copy,
    null,
    2
  );

}


async function load(){

say('');

$('#contentSlot').innerHTML =
  '';


if(current === 'home'){

const data = {
  school:
    schoolProfile?.name ||
    me.school_id,

  signed_in_as:
    me.full_name,

  role:
    me.role,

  available_modules:
    modulesAvailable()
      .map(
        key =>
          modules[key].title
      )
};

$('#output').textContent =
  JSON.stringify(
    data,
    null,
    2
  );

return;

}


if(current === 'approvals'){

renderApprovals();

return;

}


const module =
  modules[current];


if(module.special === 'profile'){

const data =
  await api(
    '/api/school-profile'
  );

renderProfile(data);

return;

}


const data =
  await api(module.path);

shownData(data);

}


async function open(key){

current = key;

drawNav();

const module =
  modules[key];

$('#moduleTitle').textContent =
  module.title;

$('#description').textContent =
  module.description;

$('#formSlot').innerHTML = '';

$('#contentSlot').innerHTML = '';


/*
Parents must never receive data-entry
forms from the frontend.
*/
let showForm =
  module.form &&
  me.role !== 'PARENT';


/*
Teachers should not create subjects
or teacher assignments.
*/
if(
  me.role === 'TEACHER' &&
  ['subject','assignment'].includes(
    module.form
  )
){
  showForm = false;
}


/*
Only School Admin manages assignments.
*/
if(
  module.form === 'assignment' &&
  me.role !== 'SCHOOL_ADMIN'
){
  showForm = false;
}


/*
Only School Admin can reset accounts.
*/
if(
  module.form === 'reset' &&
  me.role !== 'SCHOOL_ADMIN'
){
  showForm = false;
}


if(showForm){

$('#formSlot').innerHTML =
  `
  <form id="entryForm">

  ${forms[module.form]}

  <button type="submit">
  Save
  </button>

  </form>
  `;

}


try{

await load();

}catch(error){

say(
  error.message,
  true
);

$('#output').textContent =
  '';

}


const form =
  $('#entryForm');


if(form){

form.addEventListener(
'submit',
async event => {

event.preventDefault();

const body =
  Object.fromEntries(
    new FormData(form).entries()
  );


for(
  const key of [
    'score',
    'max_score',
    'amount',
    'can_mark',
    'can_attend'
  ]
){

if(body[key] !== undefined)
  body[key] =
    Number(body[key]);

}


try{

const data =
  await api(
    postPaths[module.form],
    {
      method:'POST',
      body:JSON.stringify(body)
    }
  );


say(
  data.message ||
  'Saved successfully.'
);


await load();

}catch(error){

say(
  error.message,
  true
);

}

}
);

}

}


(async () => {

  try {

    /*
     * STEP 1:
     * Verify the login session only.
     */
    const data = await api('/api/auth/me');

    me = data.user;

    if (!me) {
      location.replace('/school-login.html');
      return;
    }

    /*
     * Platform Admin does not use
     * the school workspace.
     */
    if (me.role === 'PLATFORM_ADMIN') {
      location.replace('/platform-schools.html');
      return;
    }

    /*
     * School users must belong
     * to a school.
     */
    if (!me.school_id) {
      $('#moduleTitle').textContent =
        'Account configuration problem';

      $('#description').textContent =
        'Your account is signed in but is not assigned to a school.';

      $('#output').textContent =
        JSON.stringify(me, null, 2);

      return;
    }

    /*
     * IMPORTANT:
     * From this point onward we DO NOT
     * redirect to login if a dashboard
     * module has an error.
     */

    $('#identity').textContent =
      `${me.full_name} · ${me.role}`;

    $('#title').textContent =
      'School Dashboard';

    /*
     * School profile failure must not
     * destroy a valid login session.
     */
    try {
      await loadSchoolIdentity();
    } catch (error) {
      console.error(
        'School identity error:',
        error
      );
    }

    drawNav();

    try {
      await open('home');
    } catch (error) {

      console.error(
        'Workspace loading error:',
        error
      );

      $('#moduleTitle').textContent =
        'School Dashboard';

      $('#description').textContent =
        'You are signed in. A dashboard module could not be loaded.';

      say(
        error.message,
        true
      );

      $('#output').textContent =
        JSON.stringify(
          {
            signed_in: true,
            user: me
          },
          null,
          2
        );
    }

  } catch (error) {

    /*
     * Only /api/auth/me failure reaches here.
     */
    console.error(
      'Authentication check failed:',
      error
    );

    $('#moduleTitle').textContent =
      'Sign-in problem';

    $('#description').textContent =
      'The server could not verify your login session.';

    say(
      error.message,
      true
    );

    $('#output').textContent =
      'Authentication failed.';

    /*
     * DO NOT automatically redirect.
     * This lets us see the real server error.
     */
  }

})();
.addEventListener(
'click',
() =>s
  load()
  .catch(
    error =>
      say(
        error.message,
        true
      )
  )
);


$('#logout')
.addEventListener(
'click',
async()=>{

await fetch(
  '/api/auth/logout',
  {
    method:'POST',
    credentials:'same-origin'
  }
).catch(()=>{});

location.href =
  '/school-login.html';

}
);

</script>

</body>
</html>
