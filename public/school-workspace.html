<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Dashboard · Liffan</title>

<style>
:root{
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  color:#172033;
  background:#f2f6fb
}
*{box-sizing:border-box}
body{margin:0}

header{
  background:#132653;
  color:#fff;
  padding:18px clamp(16px,4vw,42px);
  display:flex;
  gap:16px;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap
}

.school-head{
  display:flex;
  gap:14px;
  align-items:center
}

.logo{
  width:66px;
  height:66px;
  border-radius:14px;
  background:#fff;
  object-fit:contain;
  padding:4px;
  display:none
}

.logo-placeholder{
  width:66px;
  height:66px;
  border-radius:14px;
  background:#245ad6;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:24px
}

.brand{
  font-weight:850;
  font-size:11px;
  letter-spacing:.12em;
  color:#a9c1ff
}

h1{margin:4px 0;font-size:24px}
header p{margin:0;color:#d5def7;font-size:13px}

button,a.btn{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  background:#245ad6;
  color:#fff;
  text-decoration:none;
  font:inherit;
  font-weight:700;
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.mutebtn{
  background:#e8eefc;
  color:#234eab
}

.danger{
  background:#b42318
}

.layout{
  max-width:1350px;
  margin:auto;
  padding:18px;
  display:grid;
  grid-template-columns:230px 1fr;
  gap:16px
}

@media(max-width:750px){
  .layout{
    grid-template-columns:1fr;
    padding:10px
  }
}

nav,.panel{
  background:white;
  border:1px solid #dce5f0;
  border-radius:14px;
  padding:14px;
  min-width:0
}

nav{
  display:grid;
  gap:6px;
  height:max-content
}

nav button{
  text-align:left;
  background:transparent;
  color:#33415c
}

nav button.active{
  background:#e8efff;
  color:#1745a8
}

.panel h2{margin:0 0 8px}

.muted{
  color:#5b6880;
  line-height:1.5
}

.msg{
  padding:10px;
  margin:12px 0;
  background:#eef3fc;
  border-radius:8px;
  white-space:pre-wrap
}

.err{
  color:#9e1c1c;
  background:#fff0f0
}

.notice{
  padding:14px;
  margin:12px 0;
  border-radius:11px;
  border:1px solid #d9e3f0;
  background:#f7f9fd
}

.notice.warning{
  background:#fff8e6;
  border-color:#f1d48b;
  color:#6d4b00
}

.notice.dangerbox{
  background:#fff0f0;
  border-color:#efb5b5;
  color:#8b1b1b
}

.notice.success{
  background:#edf9f0;
  border-color:#b9e2c2;
  color:#17632a
}

form{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  padding:14px;
  margin:14px 0;
  background:#f7f9fd;
  border:1px solid #e1e8f3;
  border-radius:11px
}

label{
  display:grid;
  gap:5px;
  font-size:13px;
  font-weight:700
}

input,select,textarea{
  width:100%;
  padding:10px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font:inherit
}

textarea{
  min-height:90px;
  grid-column:1/-1
}

pre{
  white-space:pre-wrap;
  overflow:auto;
  background:#0f1b33;
  color:#d5e5ff;
  padding:14px;
  border-radius:10px;
  font-size:12px;
  max-height:560px
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.profile{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px
}

.profile-card{
  border:1px solid #e1e8f3;
  border-radius:12px;
  padding:14px;
  background:#f8faff
}

.profile-card strong{
  display:block;
  margin-bottom:5px
}

.photos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:12px;
  margin-top:15px
}

.photo-card{
  border:1px solid #dce5f0;
  border-radius:12px;
  overflow:hidden;
  background:white
}

.photo-card img{
  width:100%;
  height:145px;
  object-fit:cover;
  display:block
}

.photo-info{
  padding:10px
}

.photo-info p{
  margin:0 0 8px;
  font-size:13px
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#e8efff;
  color:#1745a8;
  font-size:11px;
  font-weight:800
}

.statusbar{
  max-width:1350px;
  margin:16px auto 0;
  padding:0 18px
}

.statusbox{
  padding:12px 15px;
  border-radius:12px;
  font-weight:700;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap
}

.status-active{
  background:#edf9f0;
  border:1px solid #b9e2c2;
  color:#17632a
}

.status-testing{
  background:#eef4ff;
  border:1px solid #bfd1ff;
  color:#1745a8
}

.status-restricted{
  background:#fff4e8;
  border:1px solid #efc68f;
  color:#7b4600

.fee-notice{
  margin:14px 0;
  padding:14px;
  border-radius:11px;
  background:#fff8e6;
  border:1px solid #f1d48b;
  color:#624400;
  line-height:1.5

.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:12px;
  margin:16px 0

.dashboard-card{
  border:1px solid #dce5f0;
  border-radius:12px;
  padding:16px;
  background:#f8faff
}

.dashboard-card h3{
  margin:0 0 7px
}

.dashboard-card p{
  margin:0;
  color:#5b6880;
  line-height:1.45

</style>
</head>

async function api(path, options={}) {

  const response =
    await fetch(path,{
      credentials:'same-origin',
      cache:'no-store',
      ...options,
      headers:{
        ...(options.body
          ? {'Content-Type':'application/json'}
          : {}),
        ...(options.headers || {})
      }
    });

  const data =
    await response.json()
      .catch(()=>({
        error:`Unexpected response (${response.status})`
      }));

  if(!response.ok){
    throw new Error(
      data.error ||
      `Request failed (${response.status})`
    );
  }

  return data;
}

function say(text,error=false){

  const message = $('#message');

  message.hidden = !text;

  message.classList.toggle(
    'err',
    error
  );

  message.textContent = text;
}

function modulesAvailable(){

  return Object.keys(modules)
    .filter(
      key =>
        modules[key].roles.includes(me.role)
    );
}

function drawNav(){

  const list =
    modulesAvailable();

  $('#nav').innerHTML =
    list.map(
      key => `
        <button
          data-key="${key}"
          class="${current===key?'active':''}">
          ${esc(modules[key].title)}
        </button>
      `
    ).join('');

  $('#nav')
    .querySelectorAll('button')
    .forEach(
      button =>
        button.addEventListener(
          'click',
          () => open(button.dataset.key)
        )
    );
}

function renderAccessStatus(){
  if(me.role !== 'SCHOOL_ADMIN'){
    $('#accessStatus').hidden = true;
    return;
  }
  const box =
    $('#accessStatus');

  const access =
    me.school_access || {};

  const status =
    access.status ||
    'NOT_ACTIVATED';

  box.hidden = false;

  box.className =
    'statusbox';

  if(status === 'ACTIVE'){
    box.classList.add(
      'status-active'
    );
  }

  else if(status === 'TESTING'){
    box.classList.add(
      'status-testing'
    );
  }

  else{
    box.classList.add(
      'status-restricted'
    );
  }

  
  box.innerHTML = `
    <span>
      Liffan School Access:
      ${esc(status)}
      ${esc(access.paid_until ? ' · Until ' + access.paid_until : '')}
    </span>

    ${
      me.role === 'SCHOOL_ADMIN'
      ? `
        <button
          id="accessButton"
          class="mutebtn">
          Access & Support
        </button>
      `
      : ''
    }
  `;

  const button =
    $('#accessButton');

  if(button){
    button.addEventListener(
      'click',
      () => open('subscription')
    );
  }
}

function updateSchoolHeader(school){

  if(!school) return;

  schoolProfile = school;

  $('#title').textContent =
    school.name ||
    'School Dashboard';

  $('#identity').textContent =
    `${me.full_name} · ${me.role}`;

  const logo =
    $('#schoolLogo');

  const placeholder =
    $('#logoPlaceholder');

  if(school.logo_url){

    logo.src =
      school.logo_url;

    logo.style.display =
      'block';

    placeholder.style.display =
      'none';

  }else{

    logo.style.display =
      'none';

    placeholder.style.display =
      'grid';

    placeholder.textContent =
      String(
        school.name || 'S'
      )
      .trim()
      .charAt(0)
      .toUpperCase();
  }
}

async function loadSchoolIdentity(){

  const data =
    await api(

  updateSchoolHeader(
    data.school

      </p>

      <p>
        You do not need access to the Liffan Platform
        Administrator workspace.
      </p>
    </div>

    <div class="notice warning">
      If school access expires or is suspended,
      school records are not deleted.
      Liffan can restore access without recreating
      the school or its accounts.
    </div>
  `;

  $('#output').textContent =
    JSON.stringify(
      {
        school_id:me.school_id,
        school_access:access
      },
      null,
      2
    );
}

function renderProfile(data){

  const school =
    data.school || {};

  const photos =
    data.photos || [];

  updateSchoolHeader(school);

  let html = `

  <div class="profile">

    <div class="profile-card">
      <strong>School</strong>
      ${esc(school.name || '—')}
    </div>

    <div class="profile-card">
      <strong>Type</strong>
      ${esc(school.school_type || '—')}
    </div>

    <div class="profile-card">
      <strong>Location</strong>
      ${esc(school.location || '—')}
    </div>

    <div class="profile-card">
      <strong>Motto</strong>
      ${esc(school.motto || '—')}
    </div>

    <div class="profile-card">
      <strong>Phone</strong>
      ${esc(school.phone || '—')}
    </div>

    <div class="profile-card">
      <strong>Email</strong>
      ${esc(school.email || '—')}
    </div>

  </div>
  `;

  if(canEditProfile()){

    html += `

    <h3>Edit School Profile</h3>

    <form id="profileForm">

      <label>
        School name
        <input
          name="name"
          value="${esc(school.name || '')}"
          required>
      </label>

      <label>
        School type
        <input
          name="school_type"
          value="${esc(school.school_type || '')}">
      </label>

      <label>
        Location
        <input
          name="location"
          value="${esc(school.location || '')}">
      </label>

      <label>
        Motto
        <input
          name="motto"
          value="${esc(school.motto || '')}">
      </label>

      <label>
        Phone
        <input
          name="phone"
          value="${esc(school.phone || '')}">
      </label>

      <label>
        Email
        <input
          name="email"
          type="email"
          value="${esc(school.email || '')}">
      </label>

      <label>
        Website
        <input
          name="website"
          value="${esc(school.website || '')}">
      </label>

      <label>
        Logo image URL
        <input
          name="logo_url"
          value="${esc(school.logo_url || '')}">
      </label>

      <label style="grid-column:1/-1">
        School description
        <textarea name="description">${esc(school.description || '')}</textarea>
      </label>

      <button type="submit">
        Save School Profile
      </button>

    </form>

    <h3>Add School Photo</h3>

    <form id="photoForm">

      <label>
        Photo URL
        <input
          name="photo_url"
          required>
      </label>

      <label>
        Caption
        <input
          name="caption"
          maxlength="200">
      </label>

      <button type="submit">
        Add Photo
      </button>

    </form>
    `;
  }

  html += `
    <h3>School Photos</h3>
  `;

  if(!photos.length){

    html += `
      <p class="muted">
        No school photos have been added yet.
      </p>
    `;

  }else{

    html += `<div class="photos">`;

    html += photos.map(
      photo => `

        <div class="photo-card">

          <img
            src="${esc(photo.photo_url)}"
            alt="${esc(photo.caption || 'School photo')}">

          <div class="photo-info">

            <p>
              ${esc(photo.caption || 'School photo')}
            </p>

            ${
              canEditProfile()
              ? `
                <button
                  class="danger deletePhoto"
                  data-id="${esc(photo.id)}">
                  Remove
                </button>
              `
              : ''
            }

          </div>

        </div>
      `
    ).join('');

    html += `</div>`;
  }

  $('#contentSlot').innerHTML =
    html;

  $('#output').textContent =
    JSON.stringify(
      {
        school,
        photo_count:
          photos.length
      },
      null,
      2
    );

  const profileForm =
    $('#profileForm');

  if(profileForm){

    profileForm.addEventListener(
      'submit',
      async event => {

        event.preventDefault();

        const body =
          Object.fromEntries(
            new FormData(
              profileForm
            ).entries()
          );

        body.action =
          'UPDATE_PROFILE';

        try{

          await api(
            '/api/school-profile',
            {
              method:'POST',
              body:
                JSON.stringify(body)
            }
          );

          say(
            'School profile updated successfully.'
          );

          await loadSchoolIdentity();
          await load();

        }catch(error){

          say(
            error.message,
            true
          );
        }
      }
    );
  }

  const photoForm =
    $('#photoForm');

  if(photoForm){

    photoForm.addEventListener(
      'submit',
      async event => {

        event.preventDefault();

        const body =
          Object.fromEntries(
            new FormData(
              photoForm
            ).entries()
          );

        body.action =
          'ADD_PHOTO';

        try{

          await api(
            '/api/school-profile',
            {
              method:'POST',
              body:
                JSON.stringify(body)
            }
          );

          say(
            'School photo added successfully.'
          );

          photoForm.reset();

          await load();

        }catch(error){

          say(
            error.message,
            true
          );
        }
      }
    );
  }

  document
    .querySelectorAll(
      '.deletePhoto'
    )
    .forEach(
      button =>
        button.addEventListener(
          'click',
          async () => {

            if(
              !confirm(
                'Remove this school photo?'
              )
            ){
              return;
            }

            try{

              await api(
                '/api/school-profile',
                {
                  method:'POST',
                  body:
                    JSON.stringify({
                      action:
                        'DELETE_PHOTO',
                      photo_id:
                        button.dataset.id
                    })
                }
              );

              say(
                'School photo removed.'
              );

              await load();

            }catch(error){

              say(
                error.message,
                true
              );
            }
          }
        )
    );
}

function shownData(data){

  const copy = {
    ...data
  };

  delete copy.ok;

  $('#output').textContent =
    JSON.stringify(
      copy,
      null,
      2
    );
}

async function load(){

  say('');

  $('#contentSlot').innerHTML =
    '';

  if(current === 'home'){
    renderHome();
    return;
  }

  if(current === 'subscription'){
    renderSubscription();
    return;
  }

  if(current === 'approvals'){
    renderApprovals();
    return;
  }

  const module =
    modules[current];

  if(!module){
    throw new Error(
      'Dashboard module was not found.'
    );
  }

  if(module.special === 'profile'){

    const data =
      await api(
        '/api/school-profile'
      );

    renderProfile(data);
    return;
  }

  const data =
    await api(module.path);

  shownData(data);
}

function mayShowForm(module){

  if(!module.form){
    return false;
  }

  if(!schoolOperational()){
    return false;
  }

  if(module.form === 'fee'){
    return (
      me.role ===
      'FINANCE_OFFICE'
    );
  }

  if(module.form === 'reset'){
    return (
      me.role ===
      'SCHOOL_ADMIN'
    );
  }

  if(module.form === 'assignment'){
    return (
      me.role === 'SCHOOL_ADMIN' ||
      me.role === 'DEPUTY' ||
      me.role === 'SENIOR_MANAGER'
    );
  }

  if(module.form === 'subject'){
    return (
      me.role === 'SECRETARY' ||
      me.role === 'SCHOOL_ADMIN' ||
      me.role === 'DEPUTY' ||
      me.role === 'SENIOR_MANAGER'
    );
  }

  if(module.form === 'mark'){
    return (
      me.role === 'TEACHER'
    );
  }

  if(module.form === 'attendance'){
    return (
      me.role === 'TEACHER'
    );
  }

  if(module.form === 'announcement'){
    return (
      me.role === 'SECRETARY' ||
      me.role === 'SCHOOL_ADMIN' ||
      me.role === 'DEPUTY' ||
      me.role === 'SENIOR_MANAGER'
    );
  }

  return false;
}

async function open(key){

  current = key;

  drawNav();

  const module =
    modules[key];

  $('#moduleTitle').textContent =
    module.title;

  $('#description').textContent =
    module.description;

  $('#formSlot').innerHTML =
    '';

  $('#contentSlot').innerHTML =
    '';

  if(
    !schoolOperational() &&
    ![
      'home',
      'subscription'
    ].includes(key)
  ){

    $('#contentSlot').innerHTML = `
      <div class="notice warning">

        <strong>
          School operations are currently restricted.
        </strong>

        <p>
          Your login account remains valid and
          no school records have been deleted.
        </p>

        ${
          me.role === 'SCHOOL_ADMIN'
          ? `
            <button id="restrictedSupport">
              Open Liffan Access & Support
            </button>
          `
          : `
            <p>
              Contact your School Administrator
              for assistance.
            </p>
          `
        }

      </div>
    `;

    $('#output').textContent =
      JSON.stringify(
        {
          signed_in:true,
          access:
            me.school_access
        },
        null,
        2
      );

    const support =
      $('#restrictedSupport');

    if(support){
      support.addEventListener(
        'click',
        () => open('subscription')
      );
    }

    return;
  }

  const showForm =
    mayShowForm(module);

  if(showForm){

    $('#formSlot').innerHTML = `
      <form id="entryForm">

        ${forms[module.form]}

        <button type="submit">
          Save
        </button>

      </form>
    `;

    const dateInput =
      $('#entryForm input[type="date"]');

    if(dateInput && !dateInput.value){
      dateInput.value =
        new Date()
          .toISOString()
          .slice(0,10);
    }
  }

  try{

    await load();

  }catch(error){

    say(
      error.message,
      true
    );

    $('#output').textContent =
      '';
  }

  const form =
    $('#entryForm');

  if(form){

    form.addEventListener(
      'submit',
      async event => {

        event.preventDefault();

        const body =
          Object.fromEntries(
            new FormData(form)
              .entries()
          );

        for(
          const key of [
            'score',
            'max_score',
            'amount',
            'can_mark',
            'can_attend'
          ]
        ){
          if(
            body[key] !== undefined
          ){
            body[key] =
              Number(body[key]);
          }
        }

        try{

          const data =
            await api(
              postPaths[
                module.form
              ],
              {
                method:'POST',
                body:
                  JSON.stringify(body)
              }
            );

          say(
            data.message ||
            'Saved successfully.'
          );

          await load();

        }catch(error){

          say(
            error.message,
            true
          );
        }
      }
    );
  }
}

(async () => {

  try{

    const data =
      await api(
        '/api/auth/me'
      );

    me =
      data.user;

    if(!me){
      location.replace(
        '/school-login.html'
      );
      return;
    }

    /*
     * Platform Administrator must NEVER
     * use or enter a school workspace.
     */
    if(
      me.role ===
      'PLATFORM_ADMIN'
    ){
      location.replace(
        '/platform-schools.html'
      );
      return;
    }

    if(!me.school_id){

      $('#moduleTitle').textContent =
        'Account configuration problem';

      $('#description').textContent =
        'Your account is signed in but is not assigned to a school.';

      $('#output').textContent =
        JSON.stringify(
          me,
          null,
          2
        );

      return;
    }

    $('#identity').textContent =
      `${me.full_name} · ${me.role}`;

    renderAccessStatus();

    try{

      await loadSchoolIdentity();

    }catch(error){

      console.error(
        'School identity error:',
        error
      );

      $('#title').textContent =
        'School Dashboard';
    }

    drawNav();

    await open('home');

  }catch(error){

    console.error(
      'Authentication check failed:',
      error
    );

    $('#moduleTitle').textContent =
      'Sign-in problem';

    $('#description').textContent =
      'The server could not verify your login session.';

    say(
      error.message,
      true
    );

    $('#output').textContent =
      'Authentication failed.';
  }

})();

$('#refresh')
.addEventListener(
  'click',
  () => {
    load()
      .catch(
        error =>
          say(
            error.message,
            true
          )
      );

      {
        method:'POST',
        credentials:'same-origin'
      }
    ).catch(()=>{});

    location.href =
      '/school-login.html';
  }
);
