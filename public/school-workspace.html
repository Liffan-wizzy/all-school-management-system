<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School workspace | Liffan</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}header{background:#132653;color:#fff;padding:20px clamp(16px,4vw,42px);display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brand{font-weight:850;font-size:11px;letter-spacing:.12em;color:#a9c1ff}h1{margin:5px 0;font-size:24px}header p{margin:0;color:#d5def7;font-size:13px}button,a.btn{border:0;border-radius:9px;padding:10px 13px;background:#245ad6;color:#fff;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}.mutebtn{background:#e8eefc;color:#234eab}.layout{max-width:1300px;margin:auto;padding:18px;display:grid;grid-template-columns:220px 1fr;gap:16px}@media(max-width:750px){.layout{grid-template-columns:1fr;padding:10px}}nav,.panel{background:white;border:1px solid #dce5f0;border-radius:14px;padding:14px;min-width:0}nav{display:grid;gap:6px;height:max-content}nav button{text-align:left;background:transparent;color:#33415c}nav button.active{background:#e8efff;color:#1745a8}.panel h2{margin:0 0 8px}.muted{color:#5b6880;line-height:1.5}.msg{padding:10px;margin:12px 0;background:#eef3fc;border-radius:8px;white-space:pre-wrap}.err{color:#9e1c1c;background:#fff0f0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;padding:14px;margin:14px 0;background:#f7f9fd;border:1px solid #e1e8f3;border-radius:11px}label{display:grid;gap:5px;font-size:13px;font-weight:700}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:90px;grid-column:1/-1}pre{white-space:pre-wrap;overflow:auto;background:#0f1b33;color:#d5e5ff;padding:14px;border-radius:10px;font-size:12px;max-height:560px}.note{padding:12px;background:#fff9e7;border:1px solid #f0dfae;border-radius:9px;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px}
</style></head><body>
<header><div><div class="brand">LIFFAN · ALL-SCHOOL</div><h1 id="title">School workspace</h1><p id="identity">Checking your account…</p></div><div class="actions"><a class="btn mutebtn" href="/role-dashboard.html">Portal home</a><button id="logout" class="mutebtn">Sign out</button></div></header>
<div class="layout"><nav id="nav"></nav><main class="panel"><h2 id="moduleTitle">Loading…</h2><p id="description" class="muted"></p><div id="message" class="msg" hidden></div><div id="formSlot"></div><div class="actions"><button id="refresh" class="mutebtn">Refresh records</button><a class="btn mutebtn" href="/students.html">Student management</a></div><pre id="output">Loading account…</pre></main></div>
<script>
const $=s=>document.querySelector(s);let me=null,current='home';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const modules={home:{title:'Overview',path:null,roles:['PLATFORM_ADMIN','SCHOOL_ADMIN','SECRETARY','TEACHER','PARENT'],description:'Your account and school scope determine the data you can access.'},students:{title:'Students',path:'/api/students',roles:['SCHOOL_ADMIN','SECRETARY','TEACHER'],description:'Student records for this school. Use Student Management for admissions.'},children:{title:'My children',path:'/api/parent/children',roles:['PARENT'],description:'Only children the school has verified and linked to your parent account.'},subjects:{title:'Subjects',path:'/api/subjects',roles:['SCHOOL_ADMIN','SECRETARY','TEACHER'],description:'Subjects and class mappings for your school.',form:'subject'},assignments:{title:'Teacher assignments',path:'/api/teacher-assignments',roles:['SCHOOL_ADMIN','TEACHER'],description:'A school admin assigns each teacher to a subject and class.',form:'assignment'},marks:{title:'Marks & academics',path:'/api/marks',roles:['SCHOOL_ADMIN','SECRETARY','TEACHER','PARENT'],description:'Teachers can enter marks only for their assigned subject/class; parents see linked children only.',form:'mark'},attendance:{title:'Attendance',path:'/api/attendance',roles:['SCHOOL_ADMIN','SECRETARY','TEACHER','PARENT'],description:'Record attendance by student and date; teachers are restricted to assigned classes.',form:'attendance'},fees:{title:'Fees',path:'/api/fees',roles:['SCHOOL_ADMIN','SECRETARY','PARENT'],description:'Record charges and payments. Parents can view linked children only.',form:'fee'},announcements:{title:'Announcements',path:'/api/announcements',roles:['SCHOOL_ADMIN','SECRETARY','TEACHER','PARENT'],description:'School notices filtered by audience.',form:'announcement'},reports:{title:'Reports',path:'/api/reports',roles:['SCHOOL_ADMIN','SECRETARY','PARENT'],description:'School summaries; parent summaries cover linked children only.'},invitations:{title:'Invite accounts',path:'/api/invitations',roles:['SCHOOL_ADMIN'],description:'Create a one-time code for a teacher, secretary or parent. Share it privately.',form:'invite'},accounts:{title:'Accounts',path:'/api/users',roles:['SCHOOL_ADMIN'],description:'View staff accounts and reset a non-admin account password.',form:'reset'}};
const forms={
 subject:`<label>Subject name<input name="name" required maxlength="100"></label><label>Subject code<input name="code" maxlength="40"></label><label>Class / grade<input name="class_name" required maxlength="80"></label>`,
 assignment:`<label>Teacher account ID<input name="teacher_user_id" required></label><label>Subject ID<input name="subject_id" required></label><label>Class (must match subject)<input name="class_name" required></label><label>Can enter marks<select name="can_mark"><option value="1">Yes</option><option value="0">No</option></select></label><label>Can record attendance<select name="can_attend"><option value="1">Yes</option><option value="0">No</option></select></label>`,
 mark:`<label>Student ID<input name="student_id" required></label><label>Subject ID<input name="subject_id" required></label><label>Assessment name<input name="assessment_name" required></label><label>Term<input name="term"></label><label>Score<input name="score" type="number" min="0" step="0.01" required></label><label>Maximum score<input name="max_score" type="number" min="0.01" step="0.01" required></label><label>Remarks<input name="remarks"></label>`,
 attendance:`<label>Student ID<input name="student_id" required></label><label>Date<input name="attendance_date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label>Status<select name="status"><option>PRESENT</option><option>ABSENT</option><option>LATE</option><option>EXCUSED</option></select></label><label>Note<input name="note"></label>`,
 fee:`<label>Student ID<input name="student_id" required></label><label>Entry type<select name="entry_type"><option>CHARGE</option><option>PAYMENT</option>${me?.role==='SCHOOL_ADMIN'?'<option>ADJUSTMENT</option>':''}</select></label><label>Amount (KES)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Date<input name="transaction_date" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label>Description<input name="description" required></label><label>Reference<input name="reference"></label>`,
 announcement:`<label>Title<input name="title" required maxlength="160"></label><label>Audience<select name="audience"><option>ALL</option><option>PARENTS</option><option>TEACHERS</option><option>STAFF</option></select></label><label style="grid-column:1/-1">Message<textarea name="body" required maxlength="5000"></textarea></label>`,
 invite:`<label>Email<input name="email" type="email" required></label><label>Role<select name="role"><option>TEACHER</option><option>SECRETARY</option><option>PARENT</option></select></label><label>Child admission number (parents only)<input name="student_ref"></label>`,
 reset:`<label>Target account ID<input name="user_id" required></label><label>New password (12+ characters)<input name="new_password" type="password" minlength="12" required></label>`
};
const postPaths={subject:'/api/subjects',assignment:'/api/teacher-assignments',mark:'/api/marks',attendance:'/api/attendance',fee:'/api/fees',announcement:'/api/announcements',invite:'/api/invitations',reset:'/api/auth/admin-reset-password'};
async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',cache:'no-store',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const d=await r.json().catch(()=>({error:`Unexpected response (${r.status})`}));if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d;}
function say(text,error=false){const m=$('#message');m.hidden=!text;m.classList.toggle('err',error);m.textContent=text;}
function shownData(d){if(d.students||d.children||d.subjects||d.assignments||d.marks||d.attendance||d.transactions||d.announcements||d.invitations||d.users||d.summary){const data={...d};if(data.invite_code){say(`Copy this invitation code now and share it privately; it is shown only once.\n${data.invite_code}\nExpires: ${data.expires_at}`);delete data.invite_code;}$('#output').textContent=JSON.stringify(data,null,2);}else $('#output').textContent=JSON.stringify(d,null,2);}
async function load(){say('');if(current==='home'){const d={ok:true,user:me,roles:modulesAvailable(),note:'Select a module on the left. All module APIs check the current session and school scope.'};$('#output').textContent=JSON.stringify(d,null,2);return;}const m=modules[current];let path=m.path;if(current==='reports'&&me.role==='PLATFORM_ADMIN'){path=`${path}?school_id=${encodeURIComponent(prompt('Enter the school ID to view reports:')||'')}`;}const d=await api(path);shownData(d);}
function modulesAvailable(){return Object.keys(modules).filter(k=>modules[k].roles.includes(me.role));}
function drawNav(){const list=modulesAvailable();$('#nav').innerHTML=list.map(k=>`<button data-key="${k}" class="${current===k?'active':''}">${esc(modules[k].title)}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>open(b.dataset.key)));}
async function open(key){current=key;drawNav();const m=modules[key];$('#moduleTitle').textContent=m.title;$('#description').textContent=m.description;$('#formSlot').innerHTML=m.form?`<form id="entryForm">${forms[m.form]}<button type="submit">Save</button></form>`:'';if(key==='accounts')$('#description').textContent+=' Use the exact account ID shown in the JSON below.';try{await load();}catch(e){say(e.message,true);$('#output').textContent='';}const form=$('#entryForm');if(form)form.addEventListener('submit',async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(form).entries());for(const k of ['score','max_score','amount','can_mark','can_attend'])if(body[k]!==undefined)body[k]=Number(body[k]);try{const d=await api(postPaths[m.form],{method:'POST',body:JSON.stringify(body)});if(d.invite_code){say(`Invitation created. Copy the one-time code and share privately:\n${d.invite_code}\nExpires: ${d.expires_at}`);}else say(d.message||'Saved successfully.');await load();}catch(err){say(err.message,true);}});}
(async()=>{try{const d=await api('/api/auth/me');me=d.user;if(!me){location.href='/school-login.html';return;}$('#title').textContent=`${me.full_name}'s workspace`;$('#identity').textContent=`${me.email} · ${me.role}${me.school_id?` · School ${me.school_id}`:''}`;drawNav();await open('home');}catch(e){location.href='/school-login.html';}})();
$('#refresh').addEventListener('click',()=>load().catch(e=>say(e.message,true)));$('#logout').addEventListener('click',async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});location.href='/school-login.html';});
</script></body></html>
