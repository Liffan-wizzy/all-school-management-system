<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My children · Liffan</title>
<style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f2f6fb}*{box-sizing:border-box}body{margin:0;padding:22px}.wrap{max-width:850px;margin:auto}.box{background:#fff;border:1px solid #dce5f0;border-radius:16px;padding:22px;margin-bottom:14px}.brand{font-size:12px;font-weight:850;letter-spacing:.12em;color:#245ad6}h1{margin:8px 0}p{color:#526078;line-height:1.5}.child{border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:12px 0}.meta{font-size:14px;color:#526078}a{color:#245ad6}.msg{white-space:pre-wrap}</style></head><body><div class="wrap"><section class="box"><div class="brand">LIFFAN · PARENT PORTAL</div><h1>My linked children</h1><p>Only children verified and linked by your school appear here.</p><a href="/role-dashboard.html">← Back to workspace</a></section><section class="box"><div id="message" class="msg">Loading linked records…</div><div id="children"></div></section></div>
<script>const out=document.querySelector('#children'),msg=document.querySelector('#message');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}(async()=>{try{const r=await fetch('/api/parent/children',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(r.status===401){location.href='/school-login.html';return;}if(!r.ok)throw new Error(d.error||'Could not load child records.');msg.textContent=d.children?.length?'The following child records are linked to your account.':'No child is linked yet. Contact your school administrator to verify the admission number and link your account.';out.innerHTML=(d.children||[]).map(c=>`<article class="child"><h2>${esc(c.full_name)}</h2><div class="meta">Admission number: ${esc(c.admission_no||'—')}<br>Class: ${esc(c.class_name||'—')}<br>Stream: ${esc(c.stream||'—')}<br>Gender: ${esc(c.gender||'—')}</div></article>`).join('');}catch(e){msg.textContent=e.message||'Could not load child records.';}})();</script></body></html>
